name: Build site

# GitHub Pages serves the root of main ("Deploy from a branch").
# This rebuilds the game and commits index.html + assets/ to the root.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git commit -m "Update built site"
          git push
